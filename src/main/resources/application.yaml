spring:
  application:
    name: service-discovery

logging:
  level:
    org.apache.zookeeper: WARN

service-discovery:
  zookeeper:
    connect-string: ${ZOOKEEPER_CONNECT_STRING:localhost:2181,localhost:2182,localhost:2183}
    session-timeout: 15s
    connection-timeout: 5s
  registry:
    base-path: /service-discovery/services
    lease-duration: 15s
    reap-interval: 5s
    cache-initialization-timeout: 5s
